<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>whisk-api — Fixer</title>
<style>
  :root { --bg:#1e1f22; --side:#18191b; --bar:#2b2d30; --line:#2f3135; --text:#d4d4d8; --muted:#7c7f86;
          --add:#1f3d2a; --addbar:#34C759; --red:#ff6b6b; --green:#5fd37a; --accent:#FF3B30; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
               font:13px/1.45 -apple-system, BlinkMacSystemFont, sans-serif; }
  #app { display:grid; grid-template-rows: 38px 1fr 34%; grid-template-columns: 170px 1fr; height:100%; }
  #top { grid-column:1/3; display:flex; align-items:center; gap:10px; padding:0 10px; background:var(--bar);
         border-bottom:1px solid var(--line); }
  #top .title { font-weight:600; }
  #top .sp { flex:1; }
  #run { background:#2e7d32; color:#fff; border:0; border-radius:6px; padding:6px 12px; font:600 12px -apple-system, sans-serif; cursor:pointer; }
  #badge { font:600 11px ui-monospace, Menlo, monospace; padding:3px 8px; border-radius:999px; background:#3a3c41; color:var(--muted); }
  #badge.fail { background:#4a1f22; color:var(--red); } #badge.pass { background:#1d3b25; color:var(--green); }
  #side { background:var(--side); border-right:1px solid var(--line); padding:8px 0; overflow:auto; }
  #side .h { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; padding:4px 12px; }
  .file { padding:4px 12px 4px 22px; cursor:pointer; white-space:nowrap; font-family:ui-monospace, Menlo, monospace; font-size:12px; }
  .file.active { background:#2c2e33; color:#fff; }
  .file.dirty::after { content:" ●"; color:var(--addbar); }
  #code { overflow:auto; font:12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; padding:6px 0; }
  .ln { display:flex; white-space:pre; padding-right:16px; border-left:3px solid transparent; transition: background .6s; }
  .ln .n { width:42px; text-align:right; padding-right:12px; color:#55585e; user-select:none; flex:none; }
  .ln.add { background:var(--add); border-left-color:var(--addbar); }
  .ln.hot { background:#4a1f22; border-left-color:var(--red); }
  .ln.cursor { outline:1px solid #FF3B3088; }
  .kw { color:#c792ea; } .str { color:#c3e88d; } .com { color:#6a737d; font-style:italic; }
  #term { grid-column:1/3; background:#111214; border-top:1px solid var(--line); overflow:auto; padding:8px 12px;
          font:12px/1.5 ui-monospace, Menlo, monospace; white-space:pre-wrap; }
  #term .p { color:var(--green); } #term .f { color:var(--red); } #term .t { color:#e5c07b; } #term .m { color:var(--muted); }
</style>
</head>
<body>
<div id="app">
  <div id="top"><span class="title">whisk-api</span><span class="m" id="path" style="color:var(--muted)"></span>
    <span class="sp"></span><span id="badge">tests not run</span><button id="run">▶ Run tests</button></div>
  <div id="side"><div class="h">Explorer</div>
    <div class="file" data-path="product/src/signup.js">src/signup.js</div>
    <div class="file" data-path="product/src/db.js">src/db.js</div>
    <div class="file" data-path="product/src/server.js">src/server.js</div>
    <div class="file" data-path="product/test/signup.test.js">test/signup.test.js</div>
  </div>
  <div id="code"></div>
  <div id="term"><span class="m">$ npm test</span></div>
</div>
<script>
(() => {
  const code = document.getElementById('code'), term = document.getElementById('term'),
        badge = document.getElementById('badge'), pathEl = document.getElementById('path');
  let current = null;
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  function hl(line) {
    let s = esc(line);
    if (/^\s*\/\//.test(line)) return `<span class="com">${s}</span>`;
    s = s.replace(/(&quot;|"[^"]*"|'[^']*'|`[^`]*`)/g, '<span class="str">$1</span>');
    s = s.replace(/\b(const|let|function|return|if|throw|new|for|of|require|module)\b/g, '<span class="kw">$1</span>');
    return s.replace(/(\/\/.*)$/, '<span class="com">$1</span>');
  }
  async function loadFile(path, added = [], hot = []) {
    const r = await fetch('/api/file?path=' + encodeURIComponent(path));
    const { text } = await r.json();
    current = path; pathEl.textContent = '— ' + path.replace('product/', '');
    document.querySelectorAll('.file').forEach(f => f.classList.toggle('active', f.dataset.path === path));
    code.innerHTML = text.split('\n').map((l, i) =>
      `<div class="ln${added.includes(i + 1) ? ' add' : ''}${hot.includes(i + 1) ? ' hot' : ''}" id="L${i + 1}"><span class="n">${i + 1}</span><span>${hl(l) || ' '}</span></div>`).join('');
    const first = added[0] || hot[0];
    if (first) document.getElementById('L' + first)?.scrollIntoView({ block: 'center' });
    return text.split('\n').length;
  }
  function markDirty(path) { document.querySelector(`.file[data-path="${path}"]`)?.classList.add('dirty'); }
  async function runTests() {
    badge.className = ''; badge.textContent = 'running…';
    term.innerHTML = '<span class="m">$ npm test</span>\n';
    const r = await (await fetch('/api/test', { method: 'POST' })).json();
    term.innerHTML = '<span class="m">$ npm test</span>\n' + r.output.split('\n').map(l => {
      const c = l.startsWith('✔') || l.startsWith('ℹ pass') ? 'p' : l.startsWith('✖') || /Error/.test(l) || l.startsWith('ℹ fail') ? 'f'
              : l.startsWith('⚠') || l.startsWith('ℹ todo') ? 't' : 'm';
      return `<span class="${c}">${esc(l)}</span>`; }).join('\n');
    const ok = r.fail === 0 && r.todo === 0;
    badge.className = r.fail ? 'fail' : ok ? 'pass' : '';
    badge.textContent = `${r.pass}/${r.tests} passing` + (r.fail ? ` · ${r.fail} failing` : '') + (r.todo ? ` · ${r.todo} todo` : '');
    window.__lastTest = r;
    return r;
  }
  document.getElementById('run').onclick = () => { window.__lastTest = null; runTests(); };
  document.querySelectorAll('.file').forEach(f => f.onclick = () => loadFile(f.dataset.path));
  code.addEventListener('mousedown', e => {
    const ln = e.target.closest('.ln'); if (!ln) return;
    document.querySelectorAll('.ln.cursor').forEach(x => x.classList.remove('cursor'));
    ln.classList.add('cursor');
  });
  window.hive = { loadFile, runTests, markDirty, current: () => current };
  loadFile('product/src/signup.js');
})();
</script>
</body>
</html>
