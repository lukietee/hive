<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launch post — Social</title>
<style>
  :root { --bg:#0f0f12; --card:#18181d; --line:#2a2a31; --text:#ececf1; --muted:#8b8b96; --accent:#AF52DE; --red:#ff6b6b; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:15px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; }
  main { max-width:620px; margin:0 auto; padding:22px 18px; }
  .hdr { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .hdr b { font-size:17px; } .hdr span { color:var(--muted); font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; }
  .row { display:flex; gap:12px; }
  .avatar { width:42px; height:42px; border-radius:50%; background:#2F5D3A; flex:none; display:grid; place-items:center; overflow:hidden; }
  .avatar img { width:100%; height:100%; object-fit:cover; }
  textarea { width:100%; min-height:150px; resize:none; border:0; outline:0; background:transparent; color:var(--text);
             font:17px/1.45 -apple-system, BlinkMacSystemFont, sans-serif; }
  #media { display:none; margin-top:8px; border-radius:14px; overflow:hidden; border:1px solid var(--line); background:#F6F1E7; }
  #media img { display:block; width:100%; max-height:200px; object-fit:contain; padding:16px; }
  .foot { display:flex; align-items:center; justify-content:space-between; border-top:1px solid var(--line); margin-top:10px; padding-top:10px; }
  #count { font:600 13px ui-monospace, Menlo, monospace; color:var(--muted); }
  #count.over { color:var(--red); }
  button { border:0; border-radius:999px; padding:9px 18px; font:700 14px -apple-system, sans-serif; cursor:pointer; }
  #save { background:var(--accent); color:#fff; }
  #save:disabled { opacity:.45; }
  #status { margin-top:12px; color:var(--muted); font-size:13px; min-height:1.5em; }
  .note { margin-top:18px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<main>
  <div class="hdr"><b>New launch post</b><span>draft · not published</span></div>
  <div class="card">
    <div class="row">
      <div class="avatar" id="avatar">🍵</div>
      <div style="flex:1">
        <textarea id="post" placeholder="What's happening?"></textarea>
        <div id="media"><img id="media-img" alt=""></div>
      </div>
    </div>
    <div class="foot"><span id="count">0 / 280</span><button id="save">Save draft</button></div>
  </div>
  <div id="status"></div>
  <p class="note">Hive demo composer: drafts only. Posting to a real account needs the human's approval.</p>
</main>
<script>
(() => {
  const post = document.getElementById('post'), count = document.getElementById('count'),
        save = document.getElementById('save'), status = document.getElementById('status');
  const upd = () => { const n = [...post.value].length; count.textContent = `${n} / 280`; count.classList.toggle('over', n > 280);
                      save.disabled = n === 0 || n > 280; };
  post.addEventListener('input', upd); upd();
  save.onclick = () => { window.__saved = post.value; status.textContent = '✓ Draft saved, waiting for your OK to post'; };
  window.hive = {
    attach(src) { document.getElementById('media-img').src = src; document.getElementById('media').style.display = 'block';
                  document.getElementById('avatar').innerHTML = `<img src="${src}">`; },
    clear() { post.value = ''; upd(); },
    length: () => [...post.value].length,
  };
})();
</script>
</body>
</html>
