<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hive test page</title>
<style>
  :root { --bg:#f7f7f9; --card:#fff; --text:#16161a; --muted:#6b6b76; --accent:#0A84FF; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141417; --card:#1d1d22; --text:#ececf1; --muted:#9a9aa6; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 28px 18px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 18px; }
  .card { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 3px #0001; }
  label { display:block; font-size:12px; color:var(--muted); margin: 8px 0 4px; }
  input, select { width:100%; padding:10px 12px; border-radius:10px; border:1px solid #8884; background:transparent; color:inherit; font:inherit; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top: 10px; }
  button { padding:9px 14px; border-radius:10px; border:0; background:var(--accent); color:#fff; font:600 14px -apple-system, sans-serif; cursor:pointer; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  #log { font: 12px ui-monospace, Menlo, monospace; color: var(--muted); white-space: pre-wrap; min-height: 60px; }
  .on { background: #34C759 !important; }
</style>
</head>
<body>
<main>
  <h1 id="title">Acme · Waitlist</h1>
  <p class="sub">A local page the demo_sim agents work on.</p>

  <div class="card">
    <label for="name">Name</label>
    <input id="name" placeholder="Your name">
    <label for="email">Email</label>
    <input id="email" placeholder="you@example.com">
    <label for="plan">Plan</label>
    <select id="plan"><option>Free</option><option>Pro — $29/mo</option><option>Team — $99/mo</option></select>
    <div class="row">
      <button id="join">Join waitlist</button>
      <button id="pricing" class="ghost">Show pricing</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <button id="a" class="ghost">Option A</button>
      <button id="b" class="ghost">Option B</button>
      <button id="c" class="ghost">Option C</button>
    </div>
    <label>Activity</label>
    <div id="log"></div>
  </div>
</main>
<script>
  const log = (t) => { const el = document.getElementById('log'); el.textContent = (new Date().toLocaleTimeString() + '  ' + t + '\n' + el.textContent).slice(0, 600); };
  document.getElementById('join').onclick = () => log(`joined: ${document.getElementById('name').value} <${document.getElementById('email').value}>`);
  document.getElementById('pricing').onclick = () => log('pricing opened');
  for (const id of ['a','b','c']) document.getElementById(id).onclick = (e) => { e.target.classList.toggle('on'); log('clicked option ' + id.toUpperCase()); };
  // records real clicks with their viewport coordinates, to verify cursor/click alignment
  document.addEventListener('click', (e) => { window.__clicks = (window.__clicks || []).concat([[e.clientX, e.clientY]]); });
</script>
</body>
</html>
